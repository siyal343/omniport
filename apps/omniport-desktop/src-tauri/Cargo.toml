[package]
name = "omniport-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "omniport_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omniport-desktop"
path = "src/main.rs"

[features]
# Activated automatically by `tauri build` so production binaries embed `../dist`
# while `tauri dev` and `cargo test` use `devUrl` without requiring `../dist`.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
omniport-core = { path = "../../../crates/omniport-core" }
omniport-capture = { path = "../../../crates/omniport-capture" }
omniport-dissect = { path = "../../../crates/omniport-dissect" }
omniport-proto = { path = "../../../crates/omniport-proto" }
tauri = { version = "2.2", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.9"
tokio = { version = "1.43", features = ["sync", "time"] }
tempfile = "3.16"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dev-dependencies]
omniportd = { path = "../../../crates/omniportd" }
bytes = "1.9"
tokio = { version = "1.43", features = ["macros", "rt", "net"] }
