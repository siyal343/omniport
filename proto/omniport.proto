// STALE — NOT COMPILED. This file is retained only as historical design input.
//
// The authoritative control-plane schema is `crates/omniport-proto/src/types.rs`
// (Request/Response), framed by the 4-byte length-prefixed JSON codec in
// `crates/omniport-proto/src/codec.rs`. The design-only .proto that mirrors it
// lives at `crates/omniport-proto/proto/omniport.proto`.
//
// This copy disagrees with both on several points (field names, endpoint id
// width, missing Health/RemoveRoute/Shutdown RPCs, error shape). Do not edit it
// expecting runtime behaviour to change; delete it when the gRPC migration is
// either picked up or dropped.
syntax = "proto3";
package omniport.v1;

service OmniPortDaemon {
  rpc ListEndpoints (Empty) returns (EndpointList);
  rpc CreateVirtualPair (CreatePairRequest) returns (CreatePairResponse);
}

message Empty {}

message CreatePairRequest {
  string name_a = 1;
  string name_b = 2;
  uint32 baud_rate = 3;
}

message CreatePairResponse {
  uint32 endpoint_id_a = 1;
  uint32 endpoint_id_b = 2;
  string device_path_a = 3;
  string device_path_b = 4;
}

message EndpointInfo {
  uint32 id = 1;
  string name = 2;
  string kind = 3;
  uint64 rx_bytes = 4;
  uint64 tx_bytes = 5;
}

message EndpointList {
  repeated EndpointInfo endpoints = 1;
}
