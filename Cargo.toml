[workspace]
resolver = "2"
members = [
    "crates/omniport-core",
    "crates/omniport-capture",
    "crates/omniport-dissect",
    "crates/omniport-hal-posix",
    "crates/omniport-hal-windows",
    "crates/omniport-net",
    "crates/omniport-script",
    "crates/omniport-proto",
    "crates/omniportd",
    "crates/omniport-cli",
]
# Note: apps/omniport-desktop/src-tauri is excluded from default headless checks
# so CI and headless Linux environments can run `cargo test` without WebKit2GTK libs.
exclude = ["apps/omniport-desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
bytes = "1.9"
bytemuck = { version = "1.21", features = ["derive"] }
memmap2 = "0.9"
bitflags = "2.8"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.16"
proptest = "1.6"
