name: Packaged smoke debug

# Manual workflow used to iterate on the packaged-app smoke test without
# rebuilding the installer set. Downloads the `omniport-release-binary`
# artifact produced by the CI `package` job and probes WebView2/CDP behaviour.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run id that uploaded the omniport-release-binary artifact
        required: false

permissions:
  contents: read

concurrency:
  group: smoke-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Packaged smoke debug (windows)
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/omniport-desktop
        run: npm ci

      - name: Download release binary from a CI run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runId = "${{ inputs.run_id }}"
          if (-not $runId) {
            $runId = gh run list --workflow=ci.yml --limit 1 --json databaseId --jq '.[0].databaseId'
          }
          Write-Output "downloading omniport-release-binary from run $runId"
          gh run download $runId --name omniport-release-binary --dir apps/omniport-desktop/src-tauri/target/release
          Get-ChildItem apps/omniport-desktop/src-tauri/target/release | Select-Object Name, Length

      - name: Environment diagnostics
        shell: pwsh
        run: |
          Write-Output "WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=[$env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS]"
          Get-ChildItem Env: | Where-Object { $_.Name -match 'WEBVIEW2|TAURI|EDGE' } | Format-Table -AutoSize

      - name: PowerShell launch probe
        shell: pwsh
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9352"
          $env:OMNIPORT_DESKTOP_DISCONNECT = "1"
          $exe = "apps/omniport-desktop/src-tauri/target/release/omniport-desktop.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 6
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" |
            Where-Object { $_.CommandLine -match 'webview-exe-name=omniport-desktop' -and $_.CommandLine -match '--type=' } |
            Select-Object -ExpandProperty CommandLine |
            ForEach-Object { ($_ -split ' ' | Where-Object { $_ -match 'remote-debugging|webview-exe-name|--type=' }) -join ' ' }
          try {
            (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9352/json/version -TimeoutSec 3).StatusCode
          } catch {
            Write-Output "cdp failed: $($_.Exception.Message)"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process omniport-desktop -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Node smoke script
        working-directory: apps/omniport-desktop
        run: node scripts/smoke-packaged.mjs
