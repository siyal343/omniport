name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes the ICD §2 golden-fixture contract test
      # (crates/omniport-capture/tests/viewport_contract.rs).
      - name: Workspace tests
        run: cargo test --workspace --locked

  # The Windows job cannot compile `#[cfg(unix)]` / `#[cfg(target_os = "linux")]`
  # code (POSIX PTY, termios, CUSE FUSE backend), so it never type-checks the
  # unix-only backends. This job covers that half of the platform matrix.
  rust-linux:
    name: Rust workspace (ubuntu, unix backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (deny warnings, unix cfg coverage)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace tests (unix backends)
        run: cargo test --workspace --locked

  # Supply-chain policy: RustSec advisories (cargo-audit) plus license/bans/source
  # checks (cargo-deny, configuration in deny.toml).
  security:
    name: Supply chain (audit + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prebuilt binaries; avoids a multi-minute cargo install on every push.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: RustSec advisory scan
        run: cargo audit

      - name: License, bans and source policy
        run: cargo deny check

  # Release-mode NFR harnesses (ignored by the default debug suite). Thresholds
  # and recorded baselines live in docs/VV_RTM.md; failures print measured vs target.
  perf:
    name: Performance NFR harness (windows, release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: NFR-101/102 forwarding latency + 32-pair throughput
        run: cargo test --release -p omniport-core --test nfr_perf --locked -- --ignored --nocapture

      - name: NFR-103 desktop memory over a 10 GB capture
        run: cargo test --release -p omniport-capture --test nfr_memory --locked -- --ignored --nocapture

  # Builds the real Windows installers and smoke-launches the packaged release
  # binary (embedded frontend via the Tauri custom protocol, no dev server).
  package:
    name: Packaged installers + release smoke (windows)
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/omniport-desktop/src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omniport-desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/omniport-desktop
        run: npm ci

      # `tauri build` runs `beforeBuildCommand` (npm run build) first, then
      # compiles the release binary with the embedded `../dist` frontend and
      # produces the MSI (WiX) and NSIS installers.
      - name: Build MSI and NSIS installers
        working-directory: apps/omniport-desktop
        run: npx tauri build --bundles msi,nsis

      - name: Verify installer artifacts
        shell: pwsh
        run: |
          $bundle = "apps/omniport-desktop/src-tauri/target/release/bundle"
          $files = Get-ChildItem $bundle -Recurse -File -Include *.msi, *.exe -ErrorAction SilentlyContinue
          if ($files.Count -lt 2) {
            throw "expected an MSI and an NSIS installer, found $($files.Count) file(s) under $bundle"
          }
          $files | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: omniport-windows-installers
          path: |
            apps/omniport-desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/omniport-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload packaged release binary (smoke debugging)
        uses: actions/upload-artifact@v4
        with:
          name: omniport-release-binary
          path: apps/omniport-desktop/src-tauri/target/release/omniport-desktop.exe
          if-no-files-found: error

      # The production installers must not ship a remote-debugging port, so the
      # smoke binary is rebuilt from the same source with the test-only
      # tauri.smoke.conf.json (additionalBrowserArgs enables WebView2 CDP).
      - name: Rebuild release binary with CDP for the packaged smoke test
        working-directory: apps/omniport-desktop
        run: npx tauri build --no-bundle --config src-tauri/tauri.smoke.conf.json

      - name: Smoke-launch packaged release binary (embedded frontend)
        working-directory: apps/omniport-desktop
        run: node scripts/smoke-packaged.mjs

  desktop:
    name: Desktop host + frontend (windows)
    runs-on: windows-latest
    env:
      # Keep the desktop frontend artifact small on CI.
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/omniport-desktop/src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omniport-desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/omniport-desktop
        run: npm ci

      # Includes the TypeScript side of the golden viewport fixture contract
      # (src/ipc/viewportDecoder.contract.test.js).
      - name: Frontend tests
        working-directory: apps/omniport-desktop
        run: npm test

      - name: Type check
        working-directory: apps/omniport-desktop
        run: npx tsc --noEmit

      # `tauri build` embeds this directory; building it here also lets the
      # Tauri host tests compile without the custom-protocol feature.
      - name: Frontend production build
        working-directory: apps/omniport-desktop
        run: npx vite build

      - name: Tauri host format check
        working-directory: apps/omniport-desktop/src-tauri
        run: cargo fmt --check

      - name: Tauri host clippy (deny warnings)
        working-directory: apps/omniport-desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tauri host tests
        working-directory: apps/omniport-desktop/src-tauri
        run: cargo test --locked
